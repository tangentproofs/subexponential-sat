name: site

on:
  push:
    branches: [main]
  pull_request:
    # Vendored Lean changes too: the source pages render it and data/decls.json is read from it.
    paths: ["site/**", "vendor/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: python3 -m pip install --quiet pyyaml
      - name: Validate explainer nodes and run the shared tests
        run: npm test
      - name: Check decls.json / xref.json and nodes are in sync with the vendored Lean and nodes_src
        run: |
          python3 tools/scan_decls.py
          python3 tools/write_nodes.py
          git diff --exit-code data/ nodes/ || { echo "::error::data/ or nodes/ is stale; run python3 site/tools/scan_decls.py && python3 site/tools/write_nodes.py"; exit 1; }
      - name: Build (node pages + browsable Lean source in dist/src)
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
